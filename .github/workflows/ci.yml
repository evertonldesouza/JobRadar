name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node (checagem do frontend)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Checar sintaxe do frontend
        run: node --check docs/script.js

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Testes + cobertura
        run: >
          dotnet test --no-build -c Release --verbosity normal
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
        continue-on-error: true

      - name: Resumo das falhas
        if: always()
        run: |
          python3 -c "import glob, xml.etree.ElementTree as ET; ns='{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'; msgs=[]; [msgs.append('-'+(r.get('testName') or '')+' :: '+((r.find('.//'+ns+'Message').text or '')[:900]).replace(chr(10),' | ')) for f in glob.glob('**/results.trx', recursive=True) for r in ET.parse(f).getroot().iter(ns+'UnitTestResult') if r.get('outcome')=='Failed']; [print('::error title=TestFailure::'+m) for m in msgs]; print('total='+str(len(msgs)))"

      - name: Publicar cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./coverage
          if-no-files-found: ignore

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t jobradar-api:${{ github.sha }} .
