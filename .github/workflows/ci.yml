name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node (checagem do frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checar sintaxe do frontend
        run: node --check docs/script.js

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Testes + cobertura
        run: >
          dotnet test --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Publicar cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./coverage
          if-no-files-found: ignore

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t jobradar-api:${{ github.sha }} .
