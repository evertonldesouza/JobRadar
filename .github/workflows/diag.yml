name: Diagnóstico (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Testes sem cobertura (logger GitHubActions)
        run: dotnet test -c Release --logger GitHubActions --logger "console;verbosity=normal"
