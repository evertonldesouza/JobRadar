name: Diagnóstico (temporário)

on:
  push:
    branches: ['arena/45f932b4-jobradar']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore detalhado
        run: |
          dotnet restore --verbosity normal > diag-restore.txt 2>&1 || true
          {
            echo "=== ERROS ==="
            grep -nE "error|NU[0-9]{4}" diag-restore.txt | head -40
            echo
            echo "=== ÚLTIMAS LINHAS ==="
            tail -40 diag-restore.txt
          } > diag-summary.txt

      - name: Publicar diagnóstico na branch
        run: |
          git config user.name "diag"
          git config user.email "diag@users.noreply.github.com"
          git checkout -B ci-diagnostico
          git add diag-summary.txt
          git commit -m "chore(ci): diagnostico do restore [skip ci]" || true
          git push -f origin ci-diagnostico
