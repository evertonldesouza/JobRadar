name: Diagnóstico (temporário)

on:
  push:
    branches: [arena/294e7e9d-jobradar]
    paths: [.github/workflows/diag.yml]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rodar testes capturando a saída
        run: |
          set +e
          dotnet test -c Release --verbosity normal > diag-output.txt 2>&1
          echo "DOTNET_TEST_EXIT=$?" >> diag-output.txt
          tail -60 diag-output.txt
      - name: Commitar a saída na branch
        run: |
          git config user.name "diag-bot"
          git config user.email "diag@jobradar.local"
          git add diag-output.txt
          git commit -m "diag: saída dos testes [skip ci]" || echo "sem mudanças"
          git push origin HEAD:arena/294e7e9d-jobradar
